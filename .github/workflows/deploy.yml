# Publishes the cookbook whenever something is pushed to main:
# tidy photos (strip location data, resize) -> build the site -> build the PDFs -> deploy.
name: Publish cookbook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # to commit tidied photos back
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npx puppeteer browsers install chrome

      - name: Tidy photos uploaded without the add-photo script
        run: |
          npm run photos
          if [ -n "$(git status --porcelain recipes)" ]; then
            git config user.name "cookbook-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A recipes
            git commit -m "Tidy photos: convert, resize, remove location data"
            git push
          fi

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build site and PDFs
        env:
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/
          CI: "true"
        run: |
          npm run build
          npm run pdf

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
